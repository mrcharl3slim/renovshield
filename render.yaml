# Render Blueprint: one web service + one Postgres database.
services:
  - type: web
    name: renovshield
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: renovshield-db
          property: connectionString
      # Recovery email. Set both in the Render dashboard; without them the app
      # still runs and logs recovery links instead of sending them.
      # Brevo goes over HTTPS because Render blocks outbound SMTP - Gmail SMTP
      # cannot work here (smtp.gmail.com:587 and :465 both time out).
      # BREVO_SENDER must be an address verified in your Brevo account.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        sync: false

databases:
  - name: renovshield-db
    plan: free
    databaseName: renovshield
    user: renovshield
