# Render Blueprint: one web service + one Postgres database.
services:
  - type: web
    name: renovshield
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: renovshield-db
          property: connectionString

databases:
  - name: renovshield-db
    plan: free
    databaseName: renovshield
    user: renovshield
